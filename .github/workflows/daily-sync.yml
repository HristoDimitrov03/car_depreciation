name: Daily sync

on:
  # ~12:00 Bulgaria summer time (EEST = UTC+3). GitHub cron can drift a bit.
  schedule:
    - cron: "0 9 * * *"
  # Manual run from the Actions tab (daily or full catalog).
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: true
        default: daily
        type: choice
        options:
          - daily
          - full

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "full" ]; then
            python daily_sync.py --full
          else
            python daily_sync.py --daily
          fi
